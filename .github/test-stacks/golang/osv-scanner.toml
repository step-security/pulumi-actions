# Configuration for https://github.com/google/osv-scanner
#
# This file must sit beside go.mod: osv-scanner resolves config relative to the
# manifest it is scanning and does not walk up to the repository root.

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is unmaintained, with no fixed version to upgrade to (introduced at 0, never fixed). It is pulled in only transitively by go-git's commit signing, and govulncheck confirms this program calls none of its symbols. Revisit if this stack ever signs commits or verifies OpenPGP data."

[[IgnoredVulns]]
