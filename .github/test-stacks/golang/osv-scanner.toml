# Configuration for https://github.com/google/osv-scanner
#
# This file must sit beside go.mod: osv-scanner resolves config relative to the
# manifest it is scanning and does not walk up to the repository root.

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is unmaintained, with no fixed version to upgrade to (introduced at 0, never fixed). It is pulled in only transitively by go-git's commit signing, and govulncheck confirms this program calls none of its symbols. Revisit if this stack ever signs commits or verifies OpenPGP data."


# --- CI-only test stack ---
# .github/test-stacks/golang is a fixture that the workflows run Pulumi against on
# ephemeral runners. It is not part of src/ or dist/. Its go.mod/go.sum pin 2020-era
# Pulumi SDK dependencies (a newer SDK needs a newer Go and breaks the fixture), and
# the stdlib findings come from the old `go 1.14` directive, not the Go 1.24
# toolchain CI builds with. Not verified with govulncheck.

[[PackageOverrides]]
name = "stdlib"
ecosystem = "Go"
ignore = true
reason = "CI-only golang test stack dependency (see note above); not in src/ or dist/."

[[PackageOverrides]]
name = "github.com/dgrijalva/jwt-go"
version = "3.2.0+incompatible"
ecosystem = "Go"
ignore = true
reason = "CI-only golang test stack dependency (see note above); not in src/ or dist/."

