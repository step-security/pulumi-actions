# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-ghsas: GHSA-gcqx-w48m-w2h4,GHSA-3g3m-2fjr-6pw4,GHSA-g3hv-75wg-m249,GHSA-8988-4f7v-96qf,GHSA-45rx-2jwx-cxfr,GHSA-jfc7-64v2-mr8c,GHSA-52v5-jr5w-gjxr,GHSA-vpq2-c234-7xj6,GHSA-grv7-fg5c-xmjg,GHSA-952p-6rrq-rcjv,GHSA-qr28-fpjm-wq7f,GHSA-vcc3-ghjq-m6fr,GHSA-5w9c-rv96-fr7g,GHSA-h3mg-xc3c-68pw,GHSA-j6r3-76f7-8jcv,GHSA-mwp4-54f8-5fhr,GHSA-rpw4-54j3-4h4q,GHSA-rxp7-6hxx-x8q5,GHSA-v2v4-37r5-5v8g,GHSA-w4pp-8pjf-rmxw,GHSA-23hp-3jrh-7fpw,GHSA-34x7-hfp2-rc4v,GHSA-83g3-92jg-28cx,GHSA-8qq5-rm4j-mr97,GHSA-8x88-c5mf-7j5w,GHSA-9ppj-qmqm-q256,GHSA-gvwx-54wh-qm9j,GHSA-qffp-2rhf-9h96,GHSA-r292-9mhp-454m,GHSA-r6q2-hw4h-h46w,GHSA-vmf3-w455-68vh,GHSA-w8wr-v893-vjvp,GHSA-w5hq-g745-h8pq,GHSA-h5c3-5r3r-rr8q,GHSA-rmvr-2pp2-xj38,GHSA-xx4v-prfh-6cgc
